<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vasanthan E</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this file for deep links such as /admin. Keep the
      // path, load the app from /, and index.html puts the path back.
      try {
        sessionStorage.setItem("pf-redirect", location.pathname + location.search + location.hash);
      } catch (e) {}
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
